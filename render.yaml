# Render Blueprint for the static site. Render ignores public/_redirects (that is a Netlify file),
# so the SPA rewrite below is required: without it a direct load or a full-page click on
# /projects, /history, /contact-me or /portfolio returns Render's 404 page.
# If the service was created by hand in the dashboard instead, add the same rule under
# Redirects/Rewrites: Source /*  Destination /index.html  Action Rewrite.
services:
  - type: web
    runtime: static
    name: sakshi-portfolio
    buildCommand: npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: GENERATE_SOURCEMAP
        value: "false"
